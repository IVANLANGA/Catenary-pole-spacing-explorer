<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catenary pole spacing explorer</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 20px;
    color: #1a1a1a;
    background: #fafafa;
  }
  h1 { font-size: 20px; font-weight: 600; }
  p.sub { color: #666; font-size: 14px; margin-top: -8px; }
  .cards { display: flex; flex-wrap: wrap; gap: 16px; margin: 20px 0; }
  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 12px 16px;
    min-width: 120px;
  }
  .card p.label { font-size: 13px; color: #666; margin: 0 0 4px; }
  .card p.value { font-size: 20px; font-weight: 600; margin: 0; }
  .controls { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
  .controls label { font-size: 13px; color: #666; white-space: nowrap; }
  .controls input[type=range] { flex: 1; }
  .controls span { font-size: 14px; font-weight: 600; min-width: 50px; text-align: right; }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  button {
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #f0f0f0; }
  svg { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; width: 100%; height: auto; }
  text.t { font-size: 14px; fill: #1a1a1a; }
  text.ts { font-size: 12px; fill: #666; }
  text.th { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
</style>
</head>
<body>

<h1>Catenary pole spacing explorer</h1>
<p class="sub">Two 35 m poles connected by a 60 m rope. How far apart do they need to be for the rope to sag to a given height?</p>

<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <line x1="40" y1="340" x2="640" y2="340" stroke="#999" stroke-width="1"/>
  <text class="ts" x="46" y="356">ground</text>
  <line id="clearLine" x1="40" y1="0" x2="640" y2="0" stroke="#999" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.6"/>
  <text id="clearLabel" class="ts" x="560" y="0"></text>
  <rect id="poleL" x="0" y="0" width="6" height="0" fill="#1a1a1a" opacity="0.55"/>
  <rect id="poleR" x="0" y="0" width="6" height="0" fill="#1a1a1a" opacity="0.55"/>
  <circle id="topL" cx="0" cy="0" r="3" fill="#1a1a1a"/>
  <circle id="topR" cx="0" cy="0" r="3" fill="#1a1a1a"/>
  <path id="rope" d="" fill="none" stroke="#D85A30" stroke-width="2"/>
  <text id="dLabel" class="th" x="340" y="380" text-anchor="middle"></text>
</svg>

<div class="cards">
  <div class="card">
    <p class="label">Clearance</p>
    <p class="value" id="cVal">20.0 m</p>
  </div>
  <div class="card">
    <p class="label">Sag</p>
    <p class="value" id="sagVal">15.0 m</p>
  </div>
  <div class="card">
    <p class="label">Pole spacing</p>
    <p class="value" id="dVal">49.4 m</p>
  </div>
</div>

<div class="controls">
  <label>Rope hangs at</label>
  <input type="range" id="slider" min="5.05" max="20" step="0.05" value="20">
  <span id="sliderVal">20.0 m</span>
</div>

<div class="presets">
  <button onclick="setC(5.05)">Near 5 m</button>
  <button onclick="setC(20)">20 m</button>
</div>

<script>
const H = 35, R = 60, scale = 8, groundY = 340, centerX = 340;
const poleL = document.getElementById('poleL'), poleR = document.getElementById('poleR');
const topL = document.getElementById('topL'), topR = document.getElementById('topR');
const rope = document.getElementById('rope'), dLabel = document.getElementById('dLabel');
const clearLine = document.getElementById('clearLine'), clearLabel = document.getElementById('clearLabel');
const slider = document.getElementById('slider'), sliderVal = document.getElementById('sliderVal');
const cVal = document.getElementById('cVal'), sagVal = document.getElementById('sagVal'), dVal = document.getElementById('dVal');

// Given a desired clearance c (height of rope's lowest point above ground),
// solve the catenary parameters: a (scale), t (shape param), L (half pole-spacing).
function geometry(c) {
  const sag = H - c;
  const sHalf = R / 2;
  let x = sag / sHalf;
  x = Math.min(Math.max(x, 0.0002), 0.9998); // avoid exact 0/1 singularities
  const t = 2 * Math.atanh(x);
  const a = sHalf / Math.sinh(t);
  const L = a * t;
  return { a, t, L, D: 2 * L, sag };
}

function render(c) {
  const g = geometry(c);
  const poleTopY = groundY - H * scale;
  const clearY = groundY - c * scale;
  const halfPx = g.L * scale;
  const xL = centerX - halfPx, xR = centerX + halfPx;

  poleL.setAttribute('x', xL - 3); poleL.setAttribute('y', poleTopY); poleL.setAttribute('height', groundY - poleTopY);
  poleR.setAttribute('x', xR - 3); poleR.setAttribute('y', poleTopY); poleR.setAttribute('height', groundY - poleTopY);
  topL.setAttribute('cx', xL); topL.setAttribute('cy', poleTopY);
  topR.setAttribute('cx', xR); topR.setAttribute('cy', poleTopY);

  let d = '';
  const N = 48;
  for (let i = 0; i <= N; i++) {
    const xm = -g.L + (2 * g.L * i / N);
    const yLocal = g.a * (Math.cosh(xm / g.a) - 1);
    const yAbs = c + yLocal;
    const px = centerX + xm * scale;
    const py = groundY - yAbs * scale;
    d += (i === 0 ? 'M' : 'L') + px.toFixed(1) + ' ' + py.toFixed(1) + ' ';
  }
  rope.setAttribute('d', d);

  clearLine.setAttribute('y1', clearY); clearLine.setAttribute('y2', clearY);
  clearLabel.setAttribute('y', clearY - 6);
  clearLabel.textContent = 'clearance ' + c.toFixed(1) + ' m';

  dLabel.textContent = 'pole spacing: ' + g.D.toFixed(1) + ' m';
  cVal.textContent = c.toFixed(1) + ' m';
  sagVal.textContent = g.sag.toFixed(1) + ' m';
  dVal.textContent = g.D.toFixed(1) + ' m';
  sliderVal.textContent = c.toFixed(1) + ' m';
}

slider.addEventListener('input', () => render(parseFloat(slider.value)));
function setC(c) { slider.value = c; render(c); }
render(20);
</script>

</body>
</html>
